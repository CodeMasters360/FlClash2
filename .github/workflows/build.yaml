name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    if: &checks github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Clone Clash.Meta Core
        run: |
          rm -rf core/Clash.Meta
          git clone --depth=1 -b FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Run tests
        run: |
          TEST_FILES=$(find test -name "*_test.dart" \
            ! -name "dns_override_test.dart" \
            ! -name "ntp_override_test.dart" \
            ! -name "clash_providers_action_test.dart")
          flutter test $TEST_FILES --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  desktop:
    name: Desktop ${{ matrix.platform }}
    if: *checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Clone Clash.Meta Core
        shell: bash
        run: |
          rm -rf core/Clash.Meta
          git clone --depth=1 -b FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Prepare Go module
        shell: bash
        working-directory: core
        run: |
          go mod tidy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      - name: Mock FlClashCore binary for desktop runner check
        shell: bash
        run: |
          mkdir -p libclash/linux libclash/windows
          touch libclash/linux/FlClashCore && chmod +x libclash/linux/FlClashCore
          touch libclash/windows/FlClashCore.dll
          touch libclash/windows/FlClashCore.lib

      - name: Build debug bundle (Linux)
        if: matrix.platform == 'linux'
        env:
          CFLAGS: "-Wno-error=deprecated-declarations"
          CXXFLAGS: "-Wno-error=deprecated-declarations"
        run: flutter build linux --debug

      - name: Build debug bundle (Windows)
        if: matrix.platform == 'windows'
        run: flutter build windows --debug

  go:
    name: Go core
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Clone Clash.Meta Core
        run: |
          rm -rf core/Clash.Meta
          git clone --depth=1 -b FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          test -f core/Clash.Meta/go.mod || { echo 'Clash.Meta not found!' >&2; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go mod tidy
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=linux go vet ./platform

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go mod tidy
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

  android:
    name: Android unit tests
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Clone Clash.Meta Core
        run: |
          rm -rf core/Clash.Meta
          git clone --depth=1 -b FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta
          test -f core/Clash.Meta/go.mod || { echo 'Clash.Meta not found!' >&2; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Prepare Go core module
        working-directory: core
        run: |
          go mod tidy
          GOOS=android GOARCH=arm64 go mod tidy

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    if: *checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    if: *checks
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    if: always() && !cancelled()
    needs: [ dart, plugins, go, android, rust, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup rust (Windows ARM)
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync source from WhiteDNS/FlClash
        shell: bash
        run: |
          git remote add upstream https://github.com/WhiteDNS/FlClash.git || true
          git fetch upstream main || git fetch upstream master
          git checkout -B main FETCH_HEAD

      - name: Clone Clash.Meta Core
        shell: bash
        run: |
          rm -rf core/Clash.Meta
          git clone --depth=1 -b FlClash https://github.com/chen08209/Clash.Meta.git core/Clash.Meta

      - name: Setup Android Signing
        if: startsWith(matrix.platform, 'android')
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVICE_JSON: ${{ secrets.SERVICE_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            echo "keyAlias=$KEY_ALIAS" >> android/local.properties
            echo "storePassword=$STORE_PASSWORD" >> android/local.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/local.properties
          else
            keytool -genkey -v -keystore android/app/keystore.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=FlClash, OU=Dev, O=FlClash, L=City, S=State, C=US"
            echo "keyAlias=key" >> android/local.properties
            echo "storePassword=123456" >> android/local.properties
            echo "keyPassword=123456" >> android/local.properties
          fi

          if [ -n "$SERVICE_JSON" ]; then
            echo "$SERVICE_JSON" | base64 --decode > android/app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"flclash"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.chen08209.flclash"}},"api_key":[{"current_key":""}]}]}' > android/app/google-services.json
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Prepare Go module
        shell: bash
        working-directory: core
        run: |
          go mod tidy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Gradle
        if: startsWith(matrix.platform, 'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        if: startsWith(matrix.platform, 'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate sha256
        shell: bash
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS || true

      - name: Force Release to GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release-${{ github.run_number }}"
          name: "Build Release #${{ github.run_number }}"
          body: "Automated Build from WhiteDNS/FlClash sources. Run ID: ${{ github.run_id }}"
          draft: false
          prerelease: false
          files: ./dist/*
